# Checks every TEKTON live site in sites.json every 10 minutes (and on demand).
# A site that is down gets ONE GitHub issue labelled "down" (GitHub emails the
# owner), which closes itself when the site is back: one email per outage, not
# one per run. Free and unlimited on this public repo; keepalive.yml stops
# GitHub pausing the schedule.
name: Uptime

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Make sure the "down" label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh label create down --color B60205 --description "A live site is not answering" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
      - name: Check every site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node check.mjs
